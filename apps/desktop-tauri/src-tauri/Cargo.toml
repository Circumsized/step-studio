[package]
name = "step-studio-desktop-tauri"
version.workspace = true
# The whole workspace is MIT (LICENSE, NOTICE). Declared per crate so a licence
# audit reads a fact rather than guessing from the file list.
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# `custom-protocol` is NOT in tauri's default feature set, and without it the
# built binary stays in dev mode: it loads `build.devUrl` instead of the
# embedded `frontendDist`. `tauri build` passes this feature for you; a plain
# `cargo build` does not, so it is declared here.
tauri = { version = "2", features = ["custom-protocol", "tray-icon"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
portable-pty = "0.9"
step-studio-bridge.workspace = true
step-studio-host = { path = "../../../crates/studio-host" }
# The store reader, shared with the TUI surface: two copies would drift, and the
# drift would be silent.
step-studio-sessions = { path = "../../../crates/step-studio-sessions" }
tauri-plugin-dialog = "2.7.3"
# `artifactId` is a canonical UUID v4. Already in the lock as a transitive
# dependency, so promoting it adds no package to the tree.
uuid = { version = "1", features = ["v4"] }
# The OS keystore, holding the data-encryption key that protects the service
# definition store. The Linux backend is the synchronous `dbus-secret-service`
# crate, not the async zbus stack.
#
# Both native features are non-optional, and the Windows one was fixed a day
# before the macOS one was noticed. keyring 3 has no default features, and its
# store selection is per-OS with a `mock` fallback for each:
#   lib.rs:296 — windows, not(windows-native)  -> mock
#   lib.rs:280 — macos,   not(apple-native)    -> mock
# The mock is process-local and persists nothing, so `OsKeystoreCodec::data_key`
# reads NoEntry, mints a fresh DEK and writes it into a map that dies with the
# process. The shell then works perfectly for one launch and silently orphans
# every definition already on disk at the next one, which is the exact failure
# its own doc comment says it refuses to have. macOS is a shipping target
# (AGENTS.md: Windows and macOS Apple Silicon), so leaving `apple-native` out
# kept that bug live on the other platform.
keyring = { version = "3", features = ["sync-secret-service", "windows-native", "apple-native"] }
# AES-256-GCM over that key. A service spec's `env` block is where its API token
# lives, so the file has to be confidential rather than merely unreadable.
aes-gcm = "0.10"
# The readiness `log` pattern is compiled at save time, so a typo is refused
# while the user is still looking at the form rather than at service start.
# Already in this crate's closure, so it adds no package.
regex = "1"
# The OS randomness source, for the data-encryption key and each GCM nonce.
getrandom = "0.4"
# Navigation URLs are parsed here so a `file:` or `data:` target is refused before
# it reaches the runtime. Already in this crate's closure.
url = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
