[package]
name = "step-studio-desktop-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# `custom-protocol` is NOT in tauri's default feature set, and without it the
# built binary stays in dev mode: it loads `build.devUrl` instead of the
# embedded `frontendDist`. `tauri build` passes this feature for you; a plain
# `cargo build` does not, so it is declared here.
tauri = { version = "2", features = ["custom-protocol"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
portable-pty = "0.9"
step-studio-bridge.workspace = true
step-studio-host = { path = "../../../crates/studio-host" }
# The store reader, shared with the TUI surface: two copies would drift, and the
# drift would be silent.
step-studio-sessions = { path = "../../../crates/step-studio-sessions" }
tauri-plugin-dialog = "2.7.3"

[build-dependencies]
tauri-build = "2"
