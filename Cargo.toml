[workspace]
resolver = "2"
members = [
  "apps/desktop-tauri/src-tauri",
  "crates/studio-bridge",
  "crates/step-studio-shell",
  "crates/step-studio-runtime",
  "crates/peer-uid",
  "crates/pty-bench",
  "crates/studio-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# Micro-benchmarks only. Release, per §14.6: frame codec, event projection and
# jsonl parsing are the three hot paths the plan names.
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
step-studio-bridge = { path = "crates/studio-bridge" }
