[workspace]
resolver = "2"
members = [
  "apps/desktop-tauri/src-tauri",
  "apps/desktop-tui",
  "crates/step-studio-sessions",
  "crates/studio-bridge",
  "crates/step-studio-runtime",
  "crates/peer-uid",
  "crates/pty-bench",
  "crates/studio-host",
]

[workspace.package]
version = "0.1.17"
# The whole workspace is MIT. See LICENSE and NOTICE.
license = "MIT"
edition = "2021"
# 1.88, not lower, because the TUI surface is ratatui 0.30.2 and that is its
# own floor (0.30.0 needs 1.86, so neither fits the previous 1.85). Recorded in
# the plan's §9.4 fallback line.
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# Micro-benchmarks only. Release, per §14.6: frame codec, event projection and
# jsonl parsing are the three hot paths the plan names.
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"
hmac = "0.13"
sha2 = "0.10"
base64 = "0.22"
# Already in the lock three times over (via rand_core, ed25519-dalek and
# others), so the bridge token costs no new package.
getrandom = "0.2"
step-studio-bridge = { path = "crates/studio-bridge" }
step-studio-sessions = { path = "crates/step-studio-sessions" }
# The TUI surface's renderer and terminal. See §9.4: this is the registered
# fallback, taken because `hqtui` turned out not to exist (M6a.1 spike).
ratatui = "0.30.2"
# osc52 for the clipboard: tuicr's `y` binding writes through the terminal,
# which is also why it works over SSH where an X11 or Wayland selection would not.
crossterm = { version = "0.29", features = ["osc52"] }
