[package]
name = "step-studio-peer-uid"
version.workspace = true
# The whole workspace is MIT (LICENSE, NOTICE). Declared per crate so a licence
# audit reads a fact rather than guessing from the file list.
license.workspace = true
edition.workspace = true
rust-version.workspace = true

# The workspace forbids `unsafe`. This crate is the one exception, and it is an
# exception by size: a single `getsockopt` call, with a SAFETY comment, that
# exists because `std` will not expose the peer's uid on a Unix socket and
# `UnixStream::peer_cred` is still unstable.
[lints.rust]
unsafe_code = "allow"

[dependencies]
