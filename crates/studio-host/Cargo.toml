[package]
name = "step-studio-host"
version.workspace = true
# The whole workspace is MIT (LICENSE, NOTICE). Declared per crate so a licence
# audit reads a fact rather than guessing from the file list.
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
step-studio-bridge.workspace = true
step-studio-peer-uid = { path = "../peer-uid" }

[[bin]]
name = "step-studio-host"
path = "src/bin/studio-host.rs"
