[package]
name = "step-studio-bridge"
version.workspace = true
# The whole workspace is MIT (LICENSE, NOTICE). Declared per crate so a licence
# audit reads a fact rather than guessing from the file list.
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Named pipes on Windows only; `std` has no pipe API. The transport module is
# the sole consumer, so Unix builds carry none of it.
[target.'cfg(windows)'.dependencies]
named_pipe = "0.4"

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "hot-paths"
harness = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
getrandom.workspace = true
