name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["*.md", "docs/**", "doc/**", "ui_reference/**", ".github/ISSUE_TEMPLATE/**", ".github/PULL_REQUEST_TEMPLATE.md"]
  pull_request:
    paths-ignore: ["*.md", "docs/**", "doc/**", "ui_reference/**", ".github/ISSUE_TEMPLATE/**", ".github/PULL_REQUEST_TEMPLATE.md"]
  workflow_dispatch:
    inputs:
      scope:
        description: Core checks, full Windows/macOS tests including Runtime, or a Mac test package
        type: choice
        options: [core, full, macos-package]
        default: core

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.scope || 'core' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform:
    if: inputs.scope != 'macos-package'
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.scope == 'full' && '[{"name":"Windows","os":"windows-latest","native":"win32-x64"},{"name":"macOS (arm64)","os":"macos-15","native":"darwin-arm64"}]' || '[{"name":"Windows","os":"windows-latest","native":"win32-x64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The renderer imports chart sources from the patched vendor tree.
      - run: npm run omp:overlay:apply
      # Architecture rules, selector rules, compile, core suites, then the
      # production bundles. One entry point, same code path as a local run.
      - run: npm run check -- --production
      - run: npm run test:built
        if: inputs.scope == 'full'
      - name: Packaging and update tooling tests
        if: inputs.scope == 'full'
        run: node --test scripts/*.test.mjs

      # Native builds and the full Runtime suite are explicitly requested work.
      - uses: oven-sh/setup-bun@v2
        if: inputs.scope == 'full'
        with:
          bun-version: "1.4.4"
      - uses: Swatinem/rust-cache@v2
        if: inputs.scope == 'full'
        with:
          workspaces: omp-patch/vendor/oh-my-pi -> target
          shared-key: platform
          key: natives-${{ matrix.native }}
          cache-on-failure: "true"
      - run: npm run omp:install-deps
        if: inputs.scope == 'full'
      - run: node scripts/unapply-release-overlay.mjs
        if: inputs.scope == 'full'
      - run: npm run omp:build:natives
        if: inputs.scope == 'full'
      - run: npm run omp:verify:patches
        if: inputs.scope == 'full'

  rust:
    # The crates carry the Studio Bridge wire codec and the runtime adapter,
    # which `npm run check` does not build. The shell is excluded: it links
    # winit and would need the X libraries for no test coverage.
    name: Rust crates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: studio-crates
      # `step-studio-sessions` and `step-studio-tui` are here rather than in
      # `rust-shell`: neither links GTK, and both are on the TUI's critical path
      # — the shared store reader and the dashboard renderers the golden fixtures
      # pin.
      - run: cargo test -p step-studio-bridge -p step-studio-runtime -p step-studio-host -p step-studio-sessions -p step-studio-tui
      - run: cargo clippy -p step-studio-bridge -p step-studio-runtime -p step-studio-host -p step-studio-sessions -p step-studio-tui --all-targets -- -D warnings
      # Licences and advisories. The rule that matters is in `deny.toml`:
      # copyleft is banned, because a dependency under one would oblige
      # publishing this shell's source. Runs here rather than in a separate job
      # so the registry cache `Swatinem/rust-cache` already warmed is reused —
      # `cargo deny` resolves the same graph.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features=false

  rust-shell:
    # The shell was excluded from `rust` because it links wry and needed the GTK
    # libraries, at a time when it had no tests. It now carries the routing
    # tables, the git surface and the session store, and the routing tables are
    # exactly where a name can silently drift into the wrong dispatch arm — so
    # the exclusion is no longer "no test coverage", it is "the tests do not
    # run".
    name: Rust crates (Tauri shell)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: studio-shell
      # wry renders through webkit2gtk, so the shell does not build without
      # them. `npm run check` does not cover this crate either.
      - name: Install GTK/WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo test -p step-studio-desktop-tauri
      - run: cargo clippy -p step-studio-desktop-tauri --all-targets -- -D warnings

  rust-windows:
    # The transport is the only platform-specific code: Unix sockets here, named
    # pipes on Windows. Nothing in CI used to compile for Windows, so the pipe
    # path could rot unnoticed — this job is what keeps it honest.
    name: Rust crates (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: studio-crates-windows
      # Clippy first, for the same reason as before: `step-studio-host`'s
      # `#[cfg(not(unix))]` arms — the pipe-name endpoint, the no-op departure
      # announcement — have no other way to be compiled at all.
      - run: cargo clippy -p step-studio-bridge -p step-studio-runtime -p step-studio-host --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      # Then actually run them. This job used to be compile-and-lint only, on the
      # reasoning that the runtime is unverified here (no Step CLI, so the
      # end-to-end tests skip) and a GUI shell cannot run on a hosted runner.
      # Both are true and neither covers the unit tests, which is how a Windows
      # keystore that silently persisted nothing stayed green: the one test that
      # would have caught it ran only on Linux, where there is no Secret Service
      # and it asserts nothing. See `design/review/plan-2026-11-15.md` §11.
      # The runtime e2e still skips; that is a different, known gap.
      - run: cargo test -p step-studio-bridge -p step-studio-runtime -p step-studio-host -p step-studio-sessions -p step-studio-tui -p step-studio-desktop-tauri --target x86_64-pc-windows-msvc

  # `macos-package` was removed with the Electron shell: it packed a .app with
  # electron-builder, ad-hoc signed it, and ran `full-gui-e2e.mjs` against it. The
  # Tauri shell's macOS package is M5.3's to write, against `cargo tauri build`.
  # Its GUI evidence pipeline went with it: it drove the packaged Electron app by
  # importing `electron` and reading `apps/desktop/dist` paths. A Tauri equivalent
  # is M5.3/M5.4's to write.
