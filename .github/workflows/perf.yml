name: Streaming perf

# 手动性能诊断：需要 Chromium，不随普通 UI 改动或发布自动运行。
on:
  workflow_dispatch:

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  streaming:
    name: Streaming frame budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 性能基线必须固定浏览器版本；latest 漂移会把 Chromium 自身变化误报成产品回归。
      - run: npm i --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run perf:streaming
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: streaming-perf-report
          path: outputs/streaming-perf.json
