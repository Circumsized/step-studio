name: Streaming perf

# 手动性能诊断：需要 Chromium，不随普通 UI 改动或发布自动运行。
on:
  workflow_dispatch:

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  streaming:
    name: Streaming frame budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 性能基线必须固定浏览器版本；latest 漂移会把 Chromium 自身变化误报成产品回归。
      - run: npm i --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run perf:streaming
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: streaming-perf-report
          path: outputs/streaming-perf.json
