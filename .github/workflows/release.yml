name: Release

on:
  workflow_dispatch:
    inputs:
      release_kind:
        description: Desktop release or independently versioned Runtime
        type: choice
        options: [desktop, runtime]
        default: desktop
      target_arch:
        description: Build only on matching native Windows runners
        type: choice
        options: [both, x64, arm64]
        default: both
      runtime_channel:
        type: choice
        description: Desktop releases must bundle stable Runtime
        options: [stable, canary]
        default: stable
      runtime_min_app_version:
        type: string
        description: Tested minimum desktop version (blank uses workspace version)
        default: ""
      rebuild_runtime:
        type: boolean
        description: Force a Runtime rebuild even when its sources are unchanged
        default: false
      include_macos:
        type: boolean
        description: Also build and publish macOS (darwin-arm64, ad hoc signed)
        default: false
  push:
    tags: ["v*", "runtime-v*"]

permissions:
  contents: read
env:
  BUN_VERSION: "1.4.4"
concurrency:
  group: step-studio-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      kind: ${{ steps.config.outputs.kind }}
      runtime_platforms: ${{ steps.config.outputs.runtime_platforms }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.1
        with:
          node-version: 24
      - id: config
        env:
          TARGET_ARCH: ${{ inputs.target_arch || 'both' }}
          REQUEST_KIND: ${{ inputs.release_kind || (startsWith(github.ref_name, 'runtime-v') && 'runtime') || 'desktop' }}
          INCLUDE_MACOS: ${{ inputs.include_macos }}
        run: node scripts/release-plan.mjs

  runtime:
    needs: prepare
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/runtime-artifacts.yml
    with:
      platforms: ${{ needs.prepare.outputs.runtime_platforms }}
      runtime_channel: ${{ inputs.runtime_channel || 'stable' }}
      rebuild_runtime: ${{ inputs.rebuild_runtime || false }}
    secrets: inherit

  # `build`, `build-macos` and `build-remote` were removed with the Electron shell.
  # They ran `pack:win` / `pack:mac` (electron-builder) and the SSH remote
  # candidate, and both went with `apps/desktop`. What remains is the Runtime
  # artifact pipeline, which the Tauri shell's own `cargo tauri build` consumes;
  # the desktop packaging job is M5.3's to write, against Tauri rather than
  # electron-builder.

  # The gate. A tag can be pushed on a commit whose checks are red, and until this
  # existed it was: `v0.1.0` shipped while all four CI jobs were failing. Publishing
  # now requires this job, which runs the same slices `npm run check -- --production`
  # runs on every push, plus the Rust suite and cargo-deny.
  #
  # Deliberately not `uses: ./.github/workflows/ci.yml` — a reusable-workflow call
  # cannot see the tag's inputs, and this needs the release's own ref. Repeating the
  # three commands is cheaper than a second source of truth for what "green" means.
  verify:
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # `submodules: recursive` because the renderer imports chart sources from
      # the patched vendor tree. `fetch-depth: 0` because `log_tests` walks the
      # real repository: at the default depth 1 the page holds one commit,
      # `skip(1)` is empty, and one of its assertions has nothing left to assert.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.1
        with:
          node-version: 24
          cache: npm
      # wry renders through webkit2gtk, and `cargo test --workspace` has
      # `apps/desktop-tauri/src-tauri` in its members — without these the job
      # dies in the shell's build script before a single test runs. Same list
      # the `rust-shell` CI job installs.
      - name: Install GTK/WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.8.0
      # Without the install and the overlay, `npm run check` fails on its first
      # step: the workspace packages resolve from a `dist` that `npm ci` does not
      # produce, and the renderer's chart imports need the patched vendor tree.
      # This job used to run `check` straight off a bare checkout, so its first
      # run could not even find `typescript`.
      - run: npm ci
      - run: npm run vendor:overlay:apply
      # A catalog whose `MODEL_CATALOG_SHA256` no longer matches the file is a
      # commit that lies about what it ships — and a catalog whose `.sig.json` is
      # missing makes every client's refresh 404 while every other gate stays
      # green. Both are checked here rather than on every push, because the
      # signature can only be produced by whoever holds the Release secret.
      - run: node scripts/model-catalog.mjs --check --signature
      - run: npm run build:packages
      # Two frontend artifacts the shell's build script reads and cargo does not
      # produce: `include_str!("../../dist/bridge-init.js")` and `frontendDist`.
      - run: npm run build:bridge -w @step-studio/desktop-tauri
      - run: npm run build -w @step-studio/renderer
      - name: npm run check -- --production
        run: npm run check -- --production
      # One test in this suite needs a live provider: `step_rpc`'s
      # `step_rpc_runs_a_turn_against_the_real_cli` spawns the real Step CLI and
      # drives a turn. It skips itself when no CLI is on PATH — which is the case
      # here, since CI does not install one — so this job is green partly because
      # a test that fails on a developer machine is not run at all. That is a real
      # gap, not a pass: closing it needs either a credentialed runner or a
      # recorded-fixture mode for that test.
      - name: cargo test --workspace
        run: cargo test --workspace
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.0.12
        with:
          command: check all

  # Builds the Windows installers and attaches them to the release.
  #
  # There was no job that produced them, so the only way to get a Setup exe was to
  # run `tauri build` by hand — which is how `release-assets.mjs` came to advertise
  # an artifact name nothing ever produced. Three defects made that permanent:
  #
  #   1. No `npm ci`, no submodules, no vendor overlay, so `tauri build`'s
  #      beforeBuildCommand could not resolve a single workspace package.
  #   2. The upload was named `release-candidate-installer`, but
  #      `platformOfReleaseCandidate` only accepts `x64`, `arm64` and
  #      `darwin-arm64` — so `publish` threw `Unexpected release candidate` on the
  #      first directory it listed.
  #   3. Nothing generated the signed `updates-<platform>.json` the publisher
  #      verifies and uploads, so even a correctly named candidate was incomplete.
  #
  # `environment: release` is what makes `secrets.OMP_RUNTIME_SIGNING_KEY`
  # available; the previous job had no environment and could not have signed.
  #
  # Still missing, deliberately: darwin-arm64. It needs the ditto zip of the
  # signed `.app` that `pack:mac` used to produce, and no Windows-only release
  # should wait on it. `include_macos` stays a no-op until that step exists.
  build-installer:
    needs: [prepare, runtime]
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Windows x64 only. `win32-arm64` is not a smaller version of this job:
        # `apps/desktop-tauri/src-tauri/tauri.windows.conf.json` hardcodes
        # `x86_64-pc-windows-msvc` in both `bundle.resources` and
        # `beforeBuildCommand`, so an arm64 leg would either fail to find x64
        # std on an arm64-only toolchain or — if that were papered over — ship an
        # ARM64 shell with x64 `step-studio-host.exe` inside it, because
        # `verify-update-assets-v2.mjs` never checks the Setup's PE arch.
        # Fixing it means parameterising that triple and adding the arch
        # assertion; until then `target_arch: arm64` fails loudly below rather
        # than silently building x64.
        include:
          - { platform: win32-x64, candidate: x64, os: windows-latest, target: x86_64-pc-windows-msvc }
    env:
      GH_TOKEN: ${{ github.token }}
      STEP_STUDIO_TARGET_PLATFORM: win32
      STEP_STUDIO_TARGET_ARCH: ${{ matrix.candidate }}
      STEP_STUDIO_RUNTIME_CHANNEL: ${{ inputs.runtime_channel || 'stable' }}
      STEP_STUDIO_RELEASE_KIND: ${{ needs.prepare.outputs.kind }}
      STEP_STUDIO_RUNTIME_MIN_APP_VERSION: ${{ inputs.runtime_min_app_version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.1
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.8.0
      # Same reason as `verify`: the renderer's chart imports come from the
      # patched vendor tree, and every workspace package resolves from a `dist`
      # that `npm ci` does not create.
      - run: npm ci
      - run: npm run vendor:overlay:apply
      - run: npm run build:packages
      # `target_arch` used to narrow a matrix that no longer reads it, so asking
      # for arm64 built x64 and said nothing. Fail here instead.
      - name: Refuse an architecture this job cannot build
        if: ${{ inputs.target_arch == 'arm64' }}
        run: |
          echo "::error::win32-arm64 needs tauri.windows.conf.json parameterised off x86_64-pc-windows-msvc, plus a PE-arch assertion in verify-update-assets-v2.mjs. Build x64 until then."
          exit 1
      # `find-runtime.sh` hashes committed inputs, so it recomputes the same
      # artifact key the `runtime` job uploaded. Pattern-matching the download
      # instead would also work; this way a channel change is visible here.
      - name: Find the signed Runtime
        id: runtime
        env:
          PLATFORM: ${{ matrix.platform }}
          BUN_VERSION: ${{ env.BUN_VERSION }}
          REBUILD: "false"
        run: bash .github/scripts/find-runtime.sh
      # By `key`, not `name`: when a Runtime is reused, `name` points at the
      # earlier run's candidate while the `runtime` job re-uploads those bytes
      # under `key` in *this* run. Downloading `name` would find nothing.
      - name: Download the signed Runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.runtime.outputs.key }}
          path: runtime/${{ matrix.platform }}
      # The signed payload is one level below where the download landed:
      # `defaultArtifactDirectory()` writes to
      # `packages/runtime-installer/dist/artifacts/<platform>/<runtimeVersion>/`,
      # and the `runtime` job uploads the platform directory, so the artifact's
      # own root is the version directory. `verifySignedArtifact` reads
      # `runtime-manifest.json` from the directory it is given, so passing the
      # platform directory is an ENOENT.
      - name: Locate the staged Runtime
        id: staged
        run: |
          set -euo pipefail
          root="runtime/${{ matrix.platform }}"
          versions="$(ls "$root")"
          [ "$(printf '%s\n' "$versions" | wc -l)" -eq 1 ] || { echo "expected exactly one staged Runtime under $root, got: $versions"; exit 1; }
          echo "dir=$root/$versions" >> "$GITHUB_OUTPUT"
      - name: Build the NSIS installer
        working-directory: apps/desktop-tauri
        run: npx tauri build --target ${{ matrix.target }} --bundles nsis
      # The catalog points at a stable asset name; tauri names its output after
      # productName and version. Glob rather than spell it: the arch token moves.
      # The path is the repository root's `target/`, not
      # `apps/desktop-tauri/target/` — `src-tauri` declares no `[workspace]`
      # table and the root `Cargo.toml` lists it as a member, so cargo puts the
      # whole workspace's output in one directory.
      - name: Stage the installer under its release asset name
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          mkdir -p outputs/installer
          setup="$(ls target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe | head -1)"
          cp "$setup" "outputs/installer/Step-Studio-Setup-${version}-windows-${{ matrix.candidate }}.exe"
      # Reads the previously published signed catalogs so this candidate can
      # prove it does not move a published Runtime or app backwards; without it
      # every sequence restarts at 1. It writes STEP_STUDIO_PREVIOUS_CATALOG_DIR
      # and STEP_STUDIO_PREVIOUS_UPDATE_INDEX to $GITHUB_ENV, which is why it is
      # its own step: variables written there are visible to *later* steps, not
      # to the rest of the same `run` block.
      - name: Collect the previous signed catalogs
        run: node scripts/collect-update-history.mjs
      # `--setup` is not passed: the staged path already is
      # `packagedAppAssetPath()`, which is what the script looks for by default.
      - name: Build and verify the signed update candidate
        env:
          STEP_STUDIO_SIGNING_SECRET: ${{ secrets.OMP_RUNTIME_SIGNING_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/step-studio-runtime-signing.pem"
          printf '%s' "$STEP_STUDIO_SIGNING_SECRET" > "$key"
          chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          export STEP_STUDIO_RUNTIME_SIGNING_KEY="$key"
          export STEP_STUDIO_RUNTIME_SIGNING_KEY_ID="$(node -p 'require("./packaging/keys/trusted-keys.json").activeKeyId')"
          node scripts/build-update-assets-v2.mjs --runtime-dir "${{ steps.staged.outputs.dir }}"
          node scripts/verify-update-assets-v2.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # `releaseCandidateName()` for a Windows platform is exactly this.
          # `publish` downloads `release-candidate-*` and derives the platform
          # back out of the directory name, so the suffix is load-bearing.
          name: release-candidate-${{ matrix.candidate }}
          compression-level: 0
          path: outputs/release/${{ matrix.candidate }}/
          if-no-files-found: error

  publish:
    needs: [prepare, runtime, verify, build-installer]
    # Every need, explicitly: `needs` lists `build-installer`, and a release
    # published without its installer is the failure this job exists to
    # prevent. `!cancelled()` keeps the job reachable when a sibling was
    # cancelled rather than failed.
    if: ${{ !cancelled() && needs.runtime.result == 'success' && needs.verify.result == 'success' && needs.build-installer.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.1
        with:
          node-version: 24
      # No `merge-multiple: true`. With it, every matching artifact's contents
      # land directly in `outputs/publish/`, so `readdir` sees
      # `updates-win32-x64.json` and the Setup exe instead of the
      # `release-candidate-<arch>/` directories `platformOfReleaseCandidate`
      # matches — and the first entry throws `Unexpected release candidate`.
      # Without it, each artifact keeps its own subdirectory, which is what the
      # publisher expects.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-candidate-*
          path: outputs/publish
      - name: Publish complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          STEP_STUDIO_RELEASE_KIND: ${{ needs.prepare.outputs.kind }}
        run: node scripts/publish-update-release.mjs
