# OpenSSF Scorecard, weekly.
#
# The supply-chain items in #7 that this project can actually act on:
# Pinned-Dependencies (every `uses:` is a commit SHA, enforced by
# scripts/mutable-action-tags.test.mjs), Dependency-Update-Tool (dependabot.yml),
# Maintained (the weekly schedule itself), and Branch-Protection once the default
# branch requires review.
#
# `publish_results: public` is what makes the badge mean anything — a private
# score nobody can read is not a score. The results land on the OpenSSF REST API,
# not in this repository.
name: scorecard
on:
  schedule:
    - cron: "30 1 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
