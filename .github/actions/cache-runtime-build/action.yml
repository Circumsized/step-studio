name: Cache Runtime compilation
description: Share Bun downloads and Rust dependency/workspace output with main cache warming
runs:
  using: composite
  steps:
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.3
      with:
        path: ~/.bun/install/cache
        key: bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('omp-patch/vendor/oh-my-pi/bun.lock') }}
        restore-keys: bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.8.0
      with:
        workspaces: omp-patch/vendor/oh-my-pi -> target
        shared-key: platform
        key: natives-${{ env.STEP_STUDIO_TARGET_PLATFORM }}-${{ env.STEP_STUDIO_TARGET_ARCH }}
        cache-workspace-crates: true
        cache-on-failure: "true"
